[package]
name = "mta_sheet"
version = "0.9.0"
edition = "2024"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.6" }
leptos_axum = { version = "0.6", optional = true }
leptos_router = { version = "0.6" }
leptos_meta = { version = "0.6" }
axum = { version = "0.7", optional = true, features = ["macros"] }
tower = { version = "0.4", optional = true, features = ["util"] }
tower-http = { version = "0.5", optional = true, features = ["fs"] }
tokio = { version = "1", features = ["full"], optional = true }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "macros"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde", "js"] }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Storage", "Window", "HtmlInputElement", "Navigator", "Clipboard", "FileList", "File", "Blob", "FileReader", "ProgressEvent", "HtmlTextAreaElement", "DragEvent", "DataTransfer"] }
js-sys = "0.3"
http = "1.0"
log = "0.4"
dotenvy = { version = "0.15", optional = true }
bcrypt = { version = "0.15", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
gloo-timers = { version = "0.3", features = ["futures"] }
base64 = "0.22"
rust-embed = { version = "8.5", optional = true }
mime_guess = { version = "2.0", optional = true }

[features]
csr = ["leptos/csr", "leptos_router/csr", "leptos_meta/csr"]
hydrate = ["leptos/hydrate", "leptos_router/hydrate", "leptos_meta/hydrate"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:leptos_axum",
    "dep:sqlx",
    "dep:dotenvy",
    "dep:bcrypt",
    "dep:chrono",
    "dep:rust-embed",
    "dep:mime_guess",
    "leptos/ssr",
    "leptos_router/ssr",
    "leptos_meta/ssr",
]

[package.metadata.leptos]
output-name = "mta_sheet"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style.css"
site-addr = "0.0.0.0:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-target = "mta_sheet"
lib-features = ["hydrate"]

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

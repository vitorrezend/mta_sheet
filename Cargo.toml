[package]
name = "mta_sheet"
version = "0.23.0"
edition = "2024"
license = "MIT"

[workspace]
members = [".", "crates/mta_core"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mta_sheet_server"
path = "src/main.rs"
required-features = ["ssr"]

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
required-features = ["ssr"]

[dependencies]
mta_core = { path = "crates/mta_core" }
leptos = { version = "0.6" }
leptos_axum = { version = "0.6", optional = true, features = ["nonce"] }
leptos_router = { version = "0.6" }
leptos_meta = { version = "0.6" }
axum = { version = "0.7", optional = true, features = ["macros"] }
tower = { version = "0.4", optional = true, features = ["util"] }
tower-http = { version = "0.5", optional = true, features = ["fs", "compression-br", "compression-gzip"] }
brotli = { version = "8", optional = true }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde", "js"] }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1.7"
wasm-bindgen = "=0.2.121"
web-sys = { version = "0.3.70", features = ["Storage", "Window", "Document", "Element", "HtmlInputElement", "HtmlAnchorElement", "Navigator", "Clipboard", "FileList", "File", "Blob", "BlobPropertyBag", "Url", "FileReader", "ProgressEvent", "HtmlTextAreaElement", "DragEvent", "DataTransfer", "FormData", "Request", "Response", "RequestInit", "AudioContext", "AudioContextState", "AudioBuffer", "AudioBufferSourceNode", "AudioNode", "AudioDestinationNode", "OscillatorNode", "OscillatorType", "GainNode", "AudioParam", "EventSource", "MessageEvent", "VisibilityState", "DomRect", "HtmlCanvasElement", "CanvasRenderingContext2d", "HtmlImageElement", "TouchEvent", "TouchList", "Touch", "MediaQueryList"] }
js-sys = "0.3.70"
http = "1.0"
log = "0.4"
dotenvy = { version = "0.15", optional = true }
bcrypt = { version = "0.15", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-net = "0.6"
base64 = "0.22"
ammonia = "4"
rust-embed = { version = "8.5", optional = true }
mime_guess = { version = "2.0", optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
futures-util = { version = "0.3", optional = true }

[features]
csr = ["leptos/csr", "leptos_router/csr", "leptos_meta/csr"]
hydrate = ["leptos/hydrate", "leptos_router/hydrate", "leptos_meta/hydrate"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:brotli",
    "dep:sha2",
    "dep:leptos_axum",
    "dep:sqlx",
    "dep:dotenvy",
    "dep:bcrypt",
    "dep:chrono",
    "dep:rust-embed",
    "dep:mime_guess",
    "dep:tokio-stream",
    "dep:futures-util",
    "leptos/ssr",
    "leptos_router/ssr",
    "leptos_meta/ssr",
]

[package.metadata.leptos]
output-name = "mta_sheet"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style.css"
site-addr = "0.0.0.0:3001"
reload-port = 3002
bin-features = ["ssr"]
bin-target = "mta_sheet_server"
bin-exe-name = "mta_sheet_server"
lib-features = ["hydrate"]
lib-profile-release = "wasm-release"

# Servidor: velocidade. `panic = "unwind"` faz um panic derrubar só a requisição
# (o Axum/Tokio isola a tarefa) em vez do processo inteiro.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = true

# WebAssembly: tamanho, porque é baixada pelo navegador. Usado pelo cargo-leptos
# (lib-profile-release) e pelos builds manuais (--profile wasm-release).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Desenvolvimento: compilar rápido. Sem `codegen-units = 1` (que serializava a geração
# de código e desligava a compilação incremental fina) e com depuração só de linhas,
# suficiente para panics com arquivo e linha.
[profile.dev]
opt-level = 0
panic = "unwind"
debug = "line-tables-only"

# Dependências otimizadas uma vez e guardadas em cache: servidor e testes rodam mais
# rápido sem deixar a compilação do nosso código mais lenta.
[profile.dev.package."*"]
opt-level = 1
debug = false

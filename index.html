<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTA Sheet - RPG Character Sheet</title>
    <link data-trunk rel="css" href="style.css" />
    <script>
        // A4 natural width at 96dpi = 210mm ≈ 793px
        var A4_PX = 793;
        function applyMobileScale() {
            var scale = Math.min(1, window.innerWidth / A4_PX);
            document.documentElement.style.setProperty('--mobile-scale', scale);
            // Tell CSS the visual height so the body scrolls correctly
            document.documentElement.style.setProperty(
                '--sheet-visual-height',
                (scale * 1122) + 'px'  // 297mm ≈ 1122px
            );
        }
        applyMobileScale();
        window.addEventListener('resize', applyMobileScale);
    </script>
</head>
<body>
</body>
</html>
